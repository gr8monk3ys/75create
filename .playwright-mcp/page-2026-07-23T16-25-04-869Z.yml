    - generic [ref=f2e52]:
      - text: The daily five
      - heading "Same five things, every day." [level=2] [ref=f2e53]
      - list [ref=f2e54]:
        - listitem [ref=f2e55]:
          - generic [ref=f2e56]: "01"
          - generic [ref=f2e57]:
            - heading "Create for 30+ minutes" [level=3] [ref=f2e58]
            - paragraph [ref=f2e59]: "Work on your craft: draw, write, compose, film, code art — anything generative in your medium."
        - listitem [ref=f2e60]:
          - generic [ref=f2e61]: "02"
          - generic [ref=f2e62]:
            - heading "Study one piece of work" [level=3] [ref=f2e63]
            - paragraph [ref=f2e64]: Actively analyze something good in your medium — a painting, a chapter, a track. Not passive scrolling.
        - listitem [ref=f2e65]:
          - generic [ref=f2e66]: "03"
          - generic [ref=f2e67]:
            - heading "Log the day" [level=3] [ref=f2e68]
            - paragraph [ref=f2e69]: A short note (1–3 sentences) on what you made or learned.
        - listitem [ref=f2e70]:
          - generic [ref=f2e71]: "04"
          - generic [ref=f2e72]:
            - heading "Capture an artifact" [level=3] [ref=f2e73]
            - paragraph [ref=f2e74]: Upload or link a photo, snippet, or excerpt of the day's work (private by default).
        - listitem [ref=f2e75]:
          - generic [ref=f2e76]: "05"
          - generic [ref=f2e77]:
            - heading "Create before consuming" [level=3] [ref=f2e78]
            - paragraph [ref=f2e79]: The day's first engagement with your craft must be making, not scrolling.
      - paragraph [ref=f2e80]: Not your medium? Rename them, drop the ones that don't fit, add your own — 3 to 7 tasks. You lock the rules in before Day 1.
    - generic [ref=f2e81]:
      - text: Choose your stakes
      - heading "What happens when you miss." [level=2] [ref=f2e82]
      - paragraph [ref=f2e83]: The full reset is iconic — and the top reason people quit for good. You pick the rule up front, and it locks. No softening it at 2 a.m. on Day 40.
      - generic [ref=f2e84]:
        - generic [ref=f2e85]:
          - heading "Classic" [level=3] [ref=f2e86]
          - paragraph [ref=f2e87]: Miss a day, restart at Day 1. The iconic, unforgiving version.
        - generic [ref=f2e88]:
          - heading "Grace" [level=3] [ref=f2e89]
          - paragraph [ref=f2e90]: Three lifetime skip tokens. A fourth miss resets you.
        - generic [ref=f2e91]:
          - heading "Extend" [level=3] [ref=f2e92]
          - paragraph [ref=f2e93]: A missed day adds a day to the end. The streak resets; the work goes on.
