    - generic [ref=f3e100]:
      - text: The daily five
      - heading "Same five things, every day." [level=2] [ref=f3e101]
      - list [ref=f3e102]:
        - listitem [ref=f3e103]:
          - generic [ref=f3e104]: "01"
          - generic [ref=f3e105]:
            - heading "Create for 30+ minutes" [level=3] [ref=f3e106]
            - paragraph [ref=f3e107]: "Work on your craft: draw, write, compose, film, code art — anything generative in your medium."
        - listitem [ref=f3e108]:
          - generic [ref=f3e109]: "02"
          - generic [ref=f3e110]:
            - heading "Study one piece of work" [level=3] [ref=f3e111]
            - paragraph [ref=f3e112]: Actively analyze something good in your medium — a painting, a chapter, a track. Not passive scrolling.
        - listitem [ref=f3e113]:
          - generic [ref=f3e114]: "03"
          - generic [ref=f3e115]:
            - heading "Log the day" [level=3] [ref=f3e116]
            - paragraph [ref=f3e117]: A short note (1–3 sentences) on what you made or learned.
        - listitem [ref=f3e118]:
          - generic [ref=f3e119]: "04"
          - generic [ref=f3e120]:
            - heading "Capture an artifact" [level=3] [ref=f3e121]
            - paragraph [ref=f3e122]: Upload or link a photo, snippet, or excerpt of the day's work (private by default).
        - listitem [ref=f3e123]:
          - generic [ref=f3e124]: "05"
          - generic [ref=f3e125]:
            - heading "Create before consuming" [level=3] [ref=f3e126]
            - paragraph [ref=f3e127]: The day's first engagement with your craft must be making, not scrolling.
      - paragraph [ref=f3e128]: Not your medium? Rename them, drop the ones that don't fit, add your own — 3 to 7 tasks. You lock the rules in before Day 1.
    - generic [ref=f3e129]:
      - text: Choose your stakes
      - heading "What happens when you miss." [level=2] [ref=f3e130]
      - paragraph [ref=f3e131]: The full reset is iconic — and the top reason people quit for good. You pick the rule up front, and it locks. No softening it at 2 a.m. on Day 40.
      - generic [ref=f3e132]:
        - generic [ref=f3e133]:
          - heading "Classic" [level=3] [ref=f3e134]
          - paragraph [ref=f3e135]: Miss a day, restart at Day 1. The iconic, unforgiving version.
        - generic [ref=f3e136]:
          - heading "Grace" [level=3] [ref=f3e137]
          - paragraph [ref=f3e138]: Three lifetime skip tokens. A fourth miss resets you.
        - generic [ref=f3e139]:
          - heading "Extend" [level=3] [ref=f3e140]
          - paragraph [ref=f3e141]: A missed day adds a day to the end. The streak resets; the work goes on.
