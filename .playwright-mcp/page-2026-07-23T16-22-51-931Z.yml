    - heading "Same five things, every day." [level=2] [ref=e26]
    - list [ref=e27]:
      - listitem [ref=e28]:
        - generic [ref=e29]: "01"
        - generic [ref=e30]:
          - heading "Create for 30+ minutes" [level=3] [ref=e31]
          - paragraph [ref=e32]: "Work on your craft: draw, write, compose, film, code art — anything generative in your medium."
      - listitem [ref=e33]:
        - generic [ref=e34]: "02"
        - generic [ref=e35]:
          - heading "Study one piece of work" [level=3] [ref=e36]
          - paragraph [ref=e37]: Actively analyze something good in your medium — a painting, a chapter, a track. Not passive scrolling.
      - listitem [ref=e38]:
        - generic [ref=e39]: "03"
        - generic [ref=e40]:
          - heading "Log the day" [level=3] [ref=e41]
          - paragraph [ref=e42]: A short note (1–3 sentences) on what you made or learned.
      - listitem [ref=e43]:
        - generic [ref=e44]: "04"
        - generic [ref=e45]:
          - heading "Capture an artifact" [level=3] [ref=e46]
          - paragraph [ref=e47]: Upload or link a photo, snippet, or excerpt of the day's work (private by default).
      - listitem [ref=e48]:
        - generic [ref=e49]: "05"
        - generic [ref=e50]:
          - heading "Create before consuming" [level=3] [ref=e51]
          - paragraph [ref=e52]: The day's first engagement with your craft must be making, not scrolling.
    - paragraph [ref=e53]: Not your medium? Rename them, drop the ones that don't fit, add your own — 3 to 7 tasks. You lock the rules in before Day 1.
  - generic [ref=e54]:
    - text: Choose your stakes
    - heading "What happens when you miss." [level=2] [ref=e55]
    - paragraph [ref=e56]: The full reset is iconic — and the top reason people quit for good. You pick the rule up front, and it locks. No softening it at 2 a.m. on Day 40.
